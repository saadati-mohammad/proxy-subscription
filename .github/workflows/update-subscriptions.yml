name: Update Clash Subscriptions

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */1 * * *"
      timezone: "Asia/Tehran"

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # 2. Setup Python
      # -----------------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: generator/requirements.txt

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt

      # -----------------------------------------------------------------------
      # 4. Generate subscriptions
      # -----------------------------------------------------------------------

      - name: Generate subscriptions
        env:
          ANTPEAK_UDID: ${{ secrets.ANTPEAK_UDID }}
        run: |
          python generator/generate.py

      # -----------------------------------------------------------------------
      # 5. Commit changes
      # -----------------------------------------------------------------------

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add subscriptions/

          if git diff --cached --quiet; then
            echo "No subscription changes."
            exit 0
          fi

          git commit -m "Update Clash subscriptions"
          git push